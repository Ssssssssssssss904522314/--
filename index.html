<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PrivMessenger</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;background:#edf1f7;color:#182133}
button,input{font:inherit}button{cursor:pointer;border:0}.app{height:100vh;display:flex;justify-content:center;align-items:center;padding:18px}.shell{width:min(1180px,100%);height:min(760px,94vh);background:#fff;border-radius:24px;box-shadow:0 18px 60px #17233b22;overflow:hidden;display:flex}.auth{width:min(420px,calc(100% - 30px));margin:auto;padding:30px}.brand{font-size:29px;font-weight:850}.muted{color:#7d8799}.field{margin:14px 0}.field label{display:block;font-size:13px;font-weight:700;margin-bottom:7px}.field input,.search,.composer input{width:100%;padding:13px;border:1px solid #dce2eb;border-radius:12px;outline:0}.primary,.send{background:#5d6fe8;color:white;font-weight:750;border-radius:12px;padding:13px}.primary{width:100%}.error{min-height:18px;color:#c53d50;font-size:13px;margin-top:9px}.hint{font-size:12px;background:#f5f7fb;border-radius:12px;padding:12px;margin-top:16px}
.sidebar{width:330px;border-right:1px solid #e8ebf0;display:flex;flex-direction:column}.top{padding:18px;border-bottom:1px solid #e8ebf0}.row{display:flex;justify-content:space-between;align-items:center}.title{font-size:20px;font-weight:800}.secondary{background:#eef1f7;border-radius:10px;padding:9px 12px}.search{margin-top:12px}.users{overflow:auto}.user{display:flex;gap:11px;padding:14px 18px;border-bottom:1px solid #f0f2f6;cursor:pointer}.user:hover,.user.active{background:#f4f6ff}.avatar{width:42px;height:42px;border-radius:50%;background:linear-gradient(135deg,#6174eb,#8d5ee5);color:#fff;display:grid;place-items:center;font-weight:800;flex:none}.uinfo{min-width:0}.uname{font-weight:700}.num{font-size:12px;color:#8993a5;margin-top:3px}.main{flex:1;display:flex;flex-direction:column}.empty{margin:auto;text-align:center;color:#8791a3}.chathead{padding:15px 20px;border-bottom:1px solid #e8ebf0;display:flex;gap:11px;align-items:center}.chatbody{flex:1;overflow:auto;padding:20px;background:#f7f8fb}.bubble{max-width:72%;padding:10px 13px;border-radius:15px;margin:7px 0;line-height:1.4}.mine{margin-left:auto;background:#5d6fe8;color:#fff;border-bottom-right-radius:4px}.theirs{background:#fff;border:1px solid #e7ebf1;border-bottom-left-radius:4px}.time{font-size:10px;opacity:.65;margin-top:4px}.composer{display:flex;gap:9px;padding:12px;border-top:1px solid #e8ebf0}.composer input{flex:1}.send{padding:0 18px}.profile{position:absolute;right:25px;top:72px;background:#fff;padding:16px;border:1px solid #e2e7ef;border-radius:14px;box-shadow:0 12px 35px #17233b22;z-index:5;width:230px}.hidden{display:none}@media(max-width:700px){.app{padding:0}.shell{height:100vh;border-radius:0}.sidebar{width:100%}.main{display:none}.shell.chat-open .sidebar{display:none}.shell.chat-open .main{display:flex}}
</style></head><body><div id="root"></div>
<script>
const S={token:localStorage.getItem('pm_token'),me:null,ws:null,current:null};
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const av=n=>esc((n||'?')[0].toUpperCase());
async function api(url,opt={}){opt.headers={'Content-Type':'application/json',...(opt.headers||{}),...(S.token?{Authorization:'Bearer '+S.token}:{})};let r=await fetch(url,opt);let d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'Ошибка');return d}
function auth(){root.innerHTML=`<div class="app"><div class="shell"><div class="auth"><div class="brand">PrivMessenger</div><p class="muted">Полноценный онлайн-мессенджер</p><div class="field"><label>Номер</label><input id="number" placeholder="например 100001"></div><div class="field"><label>Имя</label><input id="name" placeholder="Ваше имя"></div><div class="field"><label>Пароль</label><input id="password" type="password" placeholder="минимум 6 символов"></div><button class="primary" onclick="register()">Зарегистрироваться</button><div style="height:8px"></div><button class="secondary" style="width:100%" onclick="login()">Войти</button><div id="error" class="error"></div><div class="hint">Этот сервер поддерживает реальных пользователей и сообщения в реальном времени.</div></div></div></div>`}
async function register(){try{let d=await api('/api/register',{method:'POST',body:JSON.stringify({number:number.value,name:name.value,password:password.value})});S.token=d.token;localStorage.pm_token=S.token;await boot()}catch(e){error.textContent=e.message}}
async function login(){try{let d=await api('/api/login',{method:'POST',body:JSON.stringify({number:number.value,password:password.value})});S.token=d.token;localStorage.pm_token=S.token;await boot()}catch(e){error.textContent=e.message}}
async function boot(){try{let d=await api('/api/me');S.me=d.user;messenger();connect()}catch{localStorage.removeItem('pm_token');S.token=null;auth()}}
function messenger(){root.innerHTML=`<div class="app"><div class="shell" id="shell"><aside class="sidebar"><div class="top"><div class="row"><div class="title">Чаты</div><button class="secondary" onclick="logout()">Выйти</button></div><input id="search" class="search" placeholder="Поиск пользователей" oninput="users()"></div><div id="users" class="users"></div></aside><main id="main" class="main"><div class="empty"><div style="font-size:48px">💬</div><h2>PrivMessenger</h2><div>Выберите пользователя</div></div></main></div></div>`;users()}
async function users(){try{let d=await api('/api/users?q='+encodeURIComponent($('search').value));$('users').innerHTML=d.users.map(u=>`<div class="user" onclick="openChat(${u.id})"><div class="avatar">${av(u.name)}</div><div class="uinfo"><div class="uname">${esc(u.name)}</div><div class="num">№ ${esc(u.number)}</div></div></div>`).join('')||'<div style="padding:20px;color:#8993a5">Никого не найдено</div>'}catch{}}
async function openChat(id){let d=await api('/api/users?q=');let u=d.users.find(x=>x.id===id);if(!u)return;S.current=u;$('shell').classList.add('chat-open');main.innerHTML=`<div class="chathead"><div class="avatar">${av(u.name)}</div><div><b>${esc(u.name)}</b><div class="muted" style="font-size:12px">№ ${esc(u.number)}</div></div></div><div id="chat" class="chatbody"></div><form class="composer" onsubmit="send(event)"><input id="text" placeholder="Сообщение..." autocomplete="off"><button class="send">Отправить</button></form>`;let m=await api('/api/messages/'+id);draw(m.messages)}
function draw(ms){chat.innerHTML=ms.map(m=>`<div class="bubble ${m.senderId===S.me.id?'mine':'theirs'}">${esc(m.text)}<div class="time">${new Date(m.createdAt).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})}</div></div>`).join('');chat.scrollTop=chat.scrollHeight}
function connect(){S.ws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host);S.ws.onopen=()=>S.ws.send(JSON.stringify({type:'auth',token:S.token}));S.ws.onmessage=e=>{let d=JSON.parse(e.data);if(d.type==='message'&&S.current&&((d.message.senderId===S.current.id&&d.message.receiverId===S.me.id)||(d.message.receiverId===S.current.id&&d.message.senderId===S.me.id))){let b=[...chat.querySelectorAll('.bubble')];let txt=d.message.text;let el=document.createElement('div');el.className='bubble '+(d.message.senderId===S.me.id?'mine':'theirs');el.innerHTML=esc(txt)+'<div class="time">'+new Date(d.message.createdAt).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})+'</div>';chat.appendChild(el);chat.scrollTop=chat.scrollHeight}};S.ws.onclose=()=>setTimeout(connect,2000)}
function send(e){e.preventDefault();let t=$('text').value.trim();if(!t||!S.ws||S.ws.readyState!==1)return;S.ws.send(JSON.stringify({type:'message',receiverId:S.current.id,text:t}));$('text').value=''}
function logout(){localStorage.removeItem('pm_token');S.token=null;S.ws?.close();auth()}
if(S.token)boot();else auth();
</script></body></html>
